[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fileplotter"
version = "0.1.0"
description = "Desktop multi-source CSV/XLSX signal plotter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PyQt6>=6.7",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.11"]

[project.scripts]
fileplotter = "fileplotter.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
qt_api = "pyqt6"
